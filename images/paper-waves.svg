<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- paper-cut layers: each sheet casts a soft shadow on the one behind it -->
    <filter id="liftUp" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="-5" stdDeviation="14" flood-color="#3f4f2c" flood-opacity=".13"/>
    </filter>
    <filter id="liftDown" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#3f4f2c" flood-opacity=".11"/>
    </filter>
    <linearGradient id="sheet1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f4e8"/>
      <stop offset="1" stop-color="#e8eedc"/>
    </linearGradient>
    <linearGradient id="sheet2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9efdd"/>
      <stop offset="1" stop-color="#dde6cf"/>
    </linearGradient>
    <linearGradient id="sheet3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe8d2"/>
      <stop offset="1" stop-color="#d2ddc2"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#fbfaf4"/>

  <!-- top-right corner sweep -->
  <path filter="url(#liftDown)" fill="#f0f3e7"
        d="M860 -20C1010 40 1080 150 1230 150C1390 150 1470 60 1620 90V-20Z"/>
  <path filter="url(#liftDown)" fill="#e7eddb"
        d="M1180 -20C1270 20 1330 70 1440 70C1520 70 1570 40 1620 30V-20Z"/>

  <!-- bottom sheets, back to front -->
  <path filter="url(#liftUp)" fill="url(#sheet1)"
        d="M-20 690C180 610 380 640 560 700C760 766 960 720 1140 630C1310 546 1480 560 1620 610V1020H-20Z"/>
  <path filter="url(#liftUp)" fill="url(#sheet2)"
        d="M-20 820C160 770 330 790 520 850C720 912 930 880 1110 800C1290 722 1460 740 1620 790V1020H-20Z"/>
  <path filter="url(#liftUp)" fill="url(#sheet3)"
        d="M-20 930C200 880 420 900 640 950C840 994 1060 960 1260 900C1400 860 1520 870 1620 900V1020H-20Z"/>
</svg>
